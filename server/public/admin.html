<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة تراخيص سبّورتي — أحمد</title><link rel="stylesheet" href="admin.css"></head><body><main><header><h1>إدارة تراخيص سبّورتي</h1><p>تأكيد وصول الدفع وإصدار الملف الشهري يتمان بواسطة المالك. هذه اللوحة تدير التحقق والتفعيل والإيقاف.</p></header><p id="message" role="status"></p><form id="login"><label>كلمة مرور المالك<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>دخول المالك</button></form><section id="dashboard" hidden><div class="actions"><button id="refresh">تحديث السجل</button><button id="export">تنزيل نسخة احتياطية للسجل</button><button id="logout">تسجيل الخروج</button></div><p>السجل يعرض آخر ٥٠٠ ترخيص. إيقاف المتصفح يمنع مفتاح هذا المتصفح؛ قد يحتاج المشترك ملفه مجددًا إذا حذف بياناته المحلية.</p><div id="licenses"></div></section></main><script type="module" src="admin.mjs"></script></body></html>
