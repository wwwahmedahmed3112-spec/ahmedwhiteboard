<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث سبّورتي بأمان</title><style>body{background:#10213d;color:#edf3ff;font:20px system-ui;padding:8vw;line-height:1.8}main{max-width:650px;margin:auto}button,a{background:#426ed6;color:white;padding:14px;border:0;border-radius:12px;font:inherit;cursor:pointer}a{display:inline-block}</style><main><h1>تحديث سبّورتي بأمان</h1><p>يحدّث هذا الزر ملفات التطبيق القديمة فقط. يحتفظ بالدروس والترخيص وبيانات الدخول.</p><button id="repair">تحديث الملفات وفتح السبورة</button><p id="status" role="status"></p><a href="/">فتح السبورة</a></main><script type="module">
document.querySelector('#repair').onclick=async()=>{const button=document.querySelector('#repair');button.disabled=true;try{document.querySelector('#status').textContent='جارٍ تحديث ملفات التطبيق…';if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations()){if(new URL(r.scope).origin===location.origin)await r.unregister();}}if('caches'in window){for(const k of await caches.keys()){if(k.startsWith('sabourati-'))await caches.delete(k);}}location.replace('/');}catch{document.querySelector('#status').textContent='تعذّر التحديث الآن. بياناتك محفوظة؛ حاول مع اتصال بالإنترنت.';button.disabled=false;}};
</script></html>
